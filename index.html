
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    p {
      color: #aaa;
      font-size: 1.1rem;
      margin-bottom: 30px;
    }

    a {
      display: inline-block;
      background: #fff;
      color: #111;
      padding: 14px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    a:hover {
      background: #ccc;
      transform: translateY(-3px);
    }

    footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: #666;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>My Portfolio.</h1>
    <p>
      Welcome to my personal space.
      My portfolio is currently hosted on Carrd.
    </p>

    <a href="https://satsuyafrango.carrd.co/"
       target="_blank"
       rel="noopener noreferrer">
      Visit My Portfolio ↗
    </a>

    <footer>
      © 2026 Felipe Gomes
    </footer>
  </main>
</body>
</html>
