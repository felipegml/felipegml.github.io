<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Music Network</title>
  <link rel="stylesheet" href="main_music.css">
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <main class="controls" aria-label="Audio sharing">
    <h1>Music Network</h1>
    <p>Share a tab or screen with audio to bring the network to life.</p>
    <div class="actions">
      <button id="start" type="button">Share audio</button>
      <button id="stop" type="button" disabled>Stop sharing</button>
    </div>
    <p id="status" role="status" aria-live="polite">Choose a source and enable audio in the browser's sharing dialog.</p>
    <p id="motion" hidden>Reduced motion is enabled, so the network remains still.</p>
  </main>
  <script src="main_music.js"></script>
</body>
</html>
