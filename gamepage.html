<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#252525">
  <title>Felipe Gomes - Games</title>
  <link rel="stylesheet" href="gamepage.css">
  <script src="game-data.js" defer></script>
  <script src="gamepage.js" defer></script>
</head>
<body>
  <header class="page-header">
    <a class="icon-button home-link" href="index.html" aria-label="Back to home">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
        <path d="M10.5 5.5 4 12l6.5 6.5M4.5 12H20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/>
      </svg>
    </a>
  </header>

  <main>
    <section class="carousel-section" aria-label="Games">
      <div class="carousel-frame">
        <div class="carousel-viewport" id="carouselViewport" role="region" aria-label="Game carousel" aria-describedby="carouselHint" tabindex="0">
          <div class="carousel-track" id="carouselTrack"></div>
        </div>
      </div>
      <p class="carousel-status" id="carouselStatus" aria-live="polite" aria-atomic="true"></p>
      <p class="carousel-hint" id="carouselHint">Drag, swipe, or use the arrow keys to browse. Select a game to see more.</p>
    </section>

    <p class="page-error" id="pageError" role="alert" hidden></p>
  </main>

  <footer class="copyright">
    <p>&copy; 2026 Felipe Gomes - @satsuyafrango. All rights reserved.</p>
  </footer>

  <section class="game-details" id="gameDetails" role="dialog" aria-modal="true" aria-labelledby="detailsTitle" hidden>
    <div class="details-panel">
      <button class="icon-button details-close" id="closeDetails" type="button" aria-label="Close game details">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.7"/>
        </svg>
      </button>
      <div class="details-layout">
        <div class="details-copy">
          <p class="eyebrow">About the game</p>
          <h2 id="detailsTitle"></h2>
          <p class="details-description" id="detailsDescription"></p>
          <a class="play-link" id="playLink" target="_blank" rel="noopener noreferrer"></a>
        </div>
        <div class="details-gallery">
          <h3>Gallery</h3>
          <div class="game-grid" id="gameGrid"></div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
